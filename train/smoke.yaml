### SMOKE TEST — verifies QLoRA runs on this 8 GB GPU. Not a real training run.
model_name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
quantization_bit: 4

dataset: public
dataset_dir: dataset
template: qwen
cutoff_len: 512
max_samples: 64
overwrite_cache: true
preprocessing_num_workers: 2

output_dir: lora/smoke
logging_steps: 1
save_steps: 1000
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 2
max_steps: 5
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
plot_loss: false
